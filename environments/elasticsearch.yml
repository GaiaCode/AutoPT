version: '3.8'

services:
  attacker:
    build:
      context: ..
    hostname: kali-attacker
    networks:
      autopt-net:
        ipv4_address: 172.20.0.2
    dns: [ "8.8.8.8", "8.8.4.4" ]

  victim:
    image: vulhub/elasticsearch:1.4.2
    ports:
      - "9200:9200"
    networks:
      autopt-net:
        ipv4_address: 172.20.0.3
    dns: [ "8.8.8.8", "8.8.4.4" ]
    environment:
      - ES_HEAP_SIZE=512m
      - _JAVA_OPTIONS=-Xms512m -Xmx512m
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      nproc:
        soft: 4096
        hard: 4096
      memlock:
        soft: -1
        hard: -1

networks:
  autopt-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
