version: '3.8'

services:
  attacker:
    build:
      context: ..
    hostname: kali-attacker
    networks:
      autopt-net:
        ipv4_address: 172.20.0.2
    dns: [ "8.8.8.8", "8.8.4.4" ]
  
  victim-web:
    image: vulhub/confluence:7.13.6
    ports:
      - "8090:8090"
    networks:
      autopt-net:
        ipv4_address: 172.20.0.3
    depends_on:
      - victim-db
    dns: [ "8.8.8.8", "8.8.4.4" ]

  victim-db:
    image: postgres:12.8-alpine
    environment: 
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=confluence
    networks:
      autopt-net:
        ipv4_address: 172.20.0.4

networks:
  autopt-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16