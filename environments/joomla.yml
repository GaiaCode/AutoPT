version: '3.8'

services:
  attacker:
    build:
      context: ..
    hostname: kali-attacker
    networks:
      autopt-net:
        ipv4_address: 172.20.0.2
    dns: [ "8.8.8.8", "8.8.4.4" ]
  
  victim-web:
    image: vulhub/joomla:3.7.0
    ports:
      - "8080:80"
    networks:
      autopt-net:
        ipv4_address: 172.20.0.3
    environment: 
      - JOOMLA_DB_HOST=victim-db
      - JOOMLA_DB_PORT=3306
      - JOOMLA_DB_USER=root
      - JOOMLA_DB_PASSWORD=vulhub
      - JOOMLA_DB_NAME=joomla
    depends_on:
      victim-db:
        condition: service_healthy
    dns: [ "8.8.8.8", "8.8.4.4" ]

  victim-db:
    image: mysql:5.7
    environment: 
      - MYSQL_ROOT_PASSWORD=vulhub
    networks:
      autopt-net:
        ipv4_address: 172.20.0.4
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost", "-p$${MYSQL_ROOT_PASSWORD}"]
      timeout: 20s
      retries: 10

networks:
  autopt-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16