version: '3.8'

services:
  attacker:
    build:
      context: .
    hostname: kali-attacker
    networks:
      autopt-net:
        ipv4_address: 172.20.0.2
    dns: [ "8.8.8.8", "8.8.4.4" ]
  
  victim:
    image: vulhub/nexus:3.21.1
    ports:
      - "8081:8081"
    networks:
      autopt-net:
        ipv4_address: 172.20.0.3
    dns: [ "8.8.8.8", "8.8.4.4" ]

    # impostazioni raccomandate per evitare crash JVM legati a fd/shm/pids
    shm_size: 512m
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      nproc:
        soft: 4096
        hard: 4096
    pids_limit: 4096

networks:
  autopt-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16